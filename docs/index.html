  ids.forEach(id => wantIds.add(id));

  let notice = '';
  if (S.capState === 'loading') notice = `<div class="notice">対局サーバーに接続しています…</div>`;
  else if (!S.db) notice = `<div class="notice"><b>通信対戦はここでは使えません。</b><br>claude.ai にサインインした状態でこのページを開くと、友達と対局できます。いまは「ひとりで練習」が使えます。</div>`;
  else if (!S.myId || !S.canWrite) notice = `<div class="notice"><b>いまは観戦だけできます。</b><br>対局するには、このページの持ち主から「編集できる権限」で招待してもらってください。</div>`;

  const left = `<div class="stack">
    <section class="card"><h2>新しい対局</h2><p class="sub">作ると一覧に「募集中」で出ます。友達が「参加する」を押すと始まります。</p>
      ${ruleSeg()}${sideSeg()}<button class="btn primary wide" data-act="create" ${can ? '' : 'disabled'}>対局を作る</button></section>
    ${practiceCard}
    ${S.room ? `<section class="card"><h2>いまここにいる人</h2><p class="sub">このページを開いている人です。</p><div class="people">${
      onlineIds.length ? onlineIds.map(id => {
        const at = S.peers.find(p => (p.by || p.presence?.uid) === id)?.presence?.at;
        const where = at === 'lobby' ? 'ロビー' : at === 'practice' ? '練習中' : at ? '対局中' : '';
        return `<span class="chip">${S.avatars[id] ? `<img src="${esc(S.avatars[id])}" alt="">` : ''}${esc(nameOf(id))}<span class="where">${where}</span></span>`;
      }).join('') : '<span class="sub">まだ誰もいません</span>'}</div></section>` : ''}
    ${notice}
  </div>`;

  const mine = [], waiting = [], others = [], ended = [];
  for (const x of g){
    const meIn = S.myId && (x.sente === S.myId || x.gote === S.myId);
    const item = {...x, n: (x.moves || []).length, res: x.result, turn: x.turn ?? (x.moves || []).length % 2, meIn};
    if (x.result || x.status === 'ended') ended.push(item);
    else if (x.status === 'waiting') waiting.push(item);
    else if (meIn) mine.push(item);
    else others.push(item);
  }
  const row = (x, btn, pill) => `<div class="row">
      <div class="vs"><span>☗ ${esc(nameOf(x.sente, x))}</span><span>☖ ${esc(nameOf(x.gote, x))}</span></div>
      <div class="meta">${modePill(x.mode)} ${pill || ''} ${x.n}手 · ${ago(x.updatedAt || x.createdAt)}</div>
      <div>${btn}</div></div>`;
  const sec = (title, items, fn) => items.length ? `<h3>${title}</h3>${items.map(fn).join('')}` : '';
  let lists = '';
  if (S.capState === 'loading') lists = `<div class="empty">読み込み中…</div>`;
  else if (!S.db) lists = `<div class="empty">通信対戦の一覧は、サインインした claude.ai で開くと表示されます。</div>`;
  else if (!g.length) lists = `<div class="empty">まだ対局がありません。左の「対局を作る」から始めましょう。</div>`;
  else lists =
    sec('あなたの対局', mine, x => {
      const myTurn = (x.sente === S.myId ? 0 : 1) === x.turn;
      return row(x, `<button class="btn primary sm" data-act="open" data-id="${esc(x.id)}">続ける</button>`, myTurn ? '<span class="pill turn">あなたの番</span>' : '<span class="pill">相手の番</span>');
    }) +
    sec('参加者募集中', waiting, x => x.meIn
      ? row(x, `<button class="btn sm" data-act="open" data-id="${esc(x.id)}">ひらく</button>`, '<span class="pill wait">相手待ち</span>')
      : row(x, `<button class="btn primary sm" data-act="join" data-id="${esc(x.id)}" ${can ? '' : 'disabled'}>参加する</button>`, '<span class="pill wait">募集中</span>')) +
    sec('ほかの対局', others, x => row(x, `<button class="btn sm" data-act="open" data-id="${esc(x.id)}">観戦する</button>`)) +
    sec('終わった対局', ended.slice(0, 15), x => row(x, `<button class="btn sm" data-act="open" data-id="${esc(x.id)}">棋譜を見る</button>`,
      `<span class="pill">${x.res ? (x.res.winner === null ? '引き分け' : SIDE[x.res.winner] + '勝ち') : '終局'}</span>`));
  if (S.lobbyError) lists = `<div class="notice">${esc(S.lobbyError)}</div>` + lists;
  $('#lobby').innerHTML = left + `<section class="list">${lists}</section>`;
}

function itemsPanel(pos, inf){
  if (!isItem()) return '';
  const free = S.local;
  let list;
  if (free) list = I.ITEMS;
  else if (inf.mySide !== null) list = pos.cards[inf.mySide];
  else return '';
  const act = canAct() && (free || pos.turn === inf.mySide);
  const cards = list.map(it => {
    const ok = act && I.canUse(pos, it, free);
    return `<button class="icard${S.itemPick === it ? ' on' : ''}" data-item="${it}" ${ok ? '' : 'disabled'}>${ICON[it]}<span>${I.INFO[it].name}</span></button>`;
  }).join('');
  let desc = 'カードにマウスを乗せると説明が出ます。';
  if (S.itemPick) desc = `${I.INFO[S.itemPick].name}：${I.INFO[S.itemPick].need === 'own' ? '自分の駒' : '相手の駒'}を選んでください（Escで取り消し）`;
  else if (!free && act && pos.cardUsed) desc = 'このターンはもうカードを使いました。';
  return `<div class="items"><div class="head"><span>アイテム</span><span class="pill">${free ? '練習：使い放題' : `${list.length}/${I.HAND_MAX}枚`}</span></div>
    ${list.length ? `<div class="cardgrid">${cards}</div>` : '<div class="sub" style="color:var(--muted);font-size:12.5px">盤上の ？ボックスに駒を進めると手に入ります。</div>'}
    <div class="idesc" id="idesc">${esc(desc)}</div></div>`;
}

function renderGame(){
  const rep = getRep(), inf = info(), g = S.game, item = isItem();
  const ply = S.viewPly ?? rep.states.length - 1;
  const pos = rep.states[ply];
  const flipped = (S.local ? false : inf.mySide === 1) !== S.manualFlip;
  const bottom = flipped ? 1 : 0, top = 1 - bottom;
  const movable = canMove();
  const legal = movable ? legalMoves() : [];
  const dests = new Map();
  if (movable && S.sel) for (const m of legal) if (matchesSel(m)) dests.set(m.to, true);
  const checkSq = inCheckAt(pos) ? checkKingSq(pos) : -1;
  const tgts = S.itemPick ? new Set(I.itemTargets(pos, S.itemPick)) : null;
  if (g){ if (g.sente) wantIds.add(g.sente); if (g.gote) wantIds.add(g.gote); }

  let cells = '';
  for (let v=0; v<81; v++){
    const sq = flipped ? 80 - v : v, pc = pos.board[sq];
    const cls = ['cell'];
    if (pos.lastTo === sq) cls.push('last');
    if (S.sel && S.sel.from === sq) cls.push('sel');
    if (dests.has(sq)){ cls.push('dest'); if (pc) cls.push('cap'); }
    if (sq === checkSq) cls.push('check');
    if (tgts?.has(sq)){ cls.push('tgt'); if (I.INFO[S.itemPick].need === 'enemy') cls.push('enemy'); }
    const selectable = movable && pc && pc.s === pos.turn && legal.some(m => m.from === sq);
    if (selectable) cls.push('can');
    if (S.dragging && S.sel && S.sel.from === sq) cls.push('lifted');
    let inner = '';
    if (pc){
      if (item){
        if (pc.float != null && pc.float >= pos.T) inner += '<i class="aura gold"></i><i class="aura shadow"></i>';
        if (pc.star === pos.T) inner += '<i class="aura rainbow"></i>';
      }
      inner += pieceHtml(pc, pc.s !== bottom, item ? pos : null);
      if (item){
        if (pc.mush) inner += `<span class="mini-b tl">${ICON.mush}</span>`;
        if (pc.frozen != null && pc.frozen >= pos.T) inner += `<span class="mini-b tr">${ICON.volt}</span>`;
        if (pc.trap && canSee(pc.s)) inner += `<span class="mini-b bl" title="仕込みカード">${ICON.ge}</span>`;
      }
    } else if (item && pos.boxes.includes(sq)) inner = '<div class="ibox">?</div>';
    cells += `<div class="${cls.join(' ')}" data-sq="${sq}">${inner}</div>`;
  }
  const hoshi = [[3,3],[3,6],[6,3],[6,6]].map(([r,c]) => `<i class="hoshi" style="left:calc(var(--cw) * ${c});top:calc(var(--ch) * ${r})"></i>`).join('');
  const files = Array.from({length:9}, (_, i) => `<span>${flipped ? i + 1 : 9 - i}</span>`).join('');
  const ranks = Array.from({length:9}, (_, i) => `<span>${'一二三四五六七八九'[flipped ? 8 - i : i]}</span>`).join('');

  let promo = '';
  if (S.promo){
    const v = flipped ? 80 - S.promo.to : S.promo.to, vr = (v/9)|0, vc = v%9;
    const pc = pos.board[S.promo.cands[0].from];
    promo = `<div class="promo" style="left:calc(var(--cw) * ${vc} - 6px);top:calc(var(--ch) * ${Math.min(vr, 7)} - 6px)">
      <button data-promo="1">${pieceHtml({...pc, p:true}, false)}<small>成る</small></button>
      <button data-promo="0">${pieceHtml({...pc, p:false}, false)}<small>成らない</small></button></div>`;
  }

  const band = side => {
    const isTurn = inf.status === 'playing' && pos.turn === side && S.viewPly === null;
    const hand = pos.hands[side];
    let hp = '';
    for (const k of E.KINDS){
      const n = hand[k]; if (!n) continue;
      const selectable = movable && side === pos.turn && legal.some(m => m.drop === k);
      const sel = S.sel?.drop === k && side === pos.turn;
      hp += `<button class="hp${selectable ? ' can' : ''}${sel ? ' sel' : ''}${sel && S.dragging ? ' lifted' : ''}" data-drop="${k}" data-side="${side}" tabindex="-1" aria-label="${E.NAMES[k]} ${n}枚">${pieceHtml({t:k, s:side, p:false}, side !== bottom)}${n > 1 ? `<span class="cnt">${n}</span>` : ''}</button>`;
    }
    const pid = S.local ? null : (side === 0 ? g?.sente : g?.gote);
    const name = S.local ? SIDE[side] : nameOf(pid);
    const on = S.room && !S.local && pid && S.online.has(pid);
    const who = `<div class="who">${BIRD[side]}<div class="nm"><b>${S.room && !S.local && pid ? `<i class="dot${on ? ' on' : ''}"></i>` : ''}${esc(name)}</b><span id="clock-${side}">0:00</span></div></div>`;
    let extra = '';
    if (item){
      if (pos.dual && pos.turn === side) extra += `<span class="fxchip" title="二刀流：あと${2 - pos.moved}手">${ICON.dual}</span>`;
      if (pos.giga[side]) extra += `<span class="fxchip" title="ギガスラッシュ構え">${ICON.giga}</span>`;
      extra += `<div class="bcards">${pos.cards[side].map(it => canSee(side) ? `<span class="bcard" title="${I.INFO[it].name}">${ICON[it]}</span>` : '<span class="bcard back">?</span>').join('')}</div>`;
    }
    return `<div class="band${isTurn ? ' turn' : ''}${isTurn && S.flash ? ' flash' : ''}">${who}<div class="hand">${hp}</div>${extra}<div class="badge ${side === 0 ? 'sente' : 'gote'}">${SIDE[side]}</div></div>`;
  };

  let overlay = '';
  if (!S.local && S.notFound) overlay = `<div class="overlay"><div class="card"><h2>対局が見つかりません</h2><p>招待リンクが間違っているか、記録の保存期間（12時間）が過ぎています。相手にもう一度リンクを送ってもらってください。</p><div class="actions"><button class="btn" data-act="lobby">ロビーへ</button></div></div></div>`;
  else if (!S.local && !g) overlay = `<div class="overlay"><div class="card"><h2>読み込み中…</h2></div></div>`;
  else if (!S.local && g.status === 'waiting' && !inf.result){
    const rules = `${g.mode === 'item' ? 'アイテム戦' : 'ふつうの将棋'}`;
    if (inf.mySide !== null){
      overlay = S.net === 'ntfy'
        ? `<div class="overlay"><div class="card"><h2>対戦相手を待っています</h2>
            <div class="invite"><span class="sub" style="color:var(--muted);font-size:13px">このリンクを友達に送ってください。開いて「参加する」を押すと始まります（${rules}・あなたは${SIDE[inf.mySide]}${g.furigoma ? '／振り駒' : ''}）。</span>
            <code>${esc(inviteUrl(S.gameId))}</code>
            <div class="actions"><button class="btn primary" data-act="copy-link">リンクをコピー</button><a class="btn line" href="https://line.me/R/msg/text/?${encodeURIComponent('将棋しよう！ ' + inviteUrl(S.gameId))}" target="_blank" rel="noopener">LINEで送る</a></div></div>
            <div class="actions"><button class="btn danger" data-act="cancel-game">募集を取り消す</button></div></div></div>`
        : `<div class="overlay"><div class="card"><h2>対戦相手を待っています</h2>
            <p>1. このページの共有メニューから友達を招待します（編集できる権限）。<br>2. 友達がロビーの「参加者募集中」で「参加する」を押すと始まります。<br>${rules}・あなたは${SIDE[inf.mySide]}${g.furigoma ? '（振り駒）' : ''}です。</p>
            <div class="actions"><button class="btn danger" data-act="cancel-game">募集を取り消す</button><button class="btn" data-act="lobby">ロビーで待つ</button></div></div></div>`;
    } else {
      const canJoin = S.net === 'ntfy' || (S.myId && S.canWrite);
      overlay = `<div class="overlay"><div class="card"><h2>${esc(nameOf(g.sente || g.gote))}さんからの対局</h2><p>${rules}です。参加するとすぐ始まります。</p>
        ${S.net === 'ntfy' ? `<p class="label" style="text-align:left">あなたの名前</p><input class="field" id="nameInput" maxlength="20" placeholder="例：たろう" value="${esc(S.myName)}" style="margin-bottom:12px">` : ''}
        <div class="actions"><button class="btn primary" data-act="join" data-id="${esc(S.gameId)}" ${canJoin ? '' : 'disabled'}>参加する</button></div></div></div>`;
    }
  }
  if (S.confirm === 'resign') overlay = `<div class="overlay"><div class="card"><h2>投了しますか？</h2><p>この対局は相手の勝ちで終わります。取り消せません。</p>
    <div class="actions"><button class="btn" data-act="resign-no">続ける</button><button class="btn danger solid" data-act="resign-yes">投了する</button></div></div></div>`;

  const table = `<div class="table">${band(top)}
    <div class="wood"><div class="files">${files}</div><div class="ranks">${ranks}</div>
      <div class="grid" id="grid">${cells}${hoshi}${promo}</div></div>
    ${band(bottom)}${overlay}</div>`;

  let big = '', small = '';
  const latest = rep.pos, n = latest.ply;
  if (inf.result){ big = resultText(inf.result, n); small = S.local ? '練習盤' : '終局しました'; }
  else if (!S.local && g?.status === 'waiting') big = '対戦相手を待っています';
  else if (S.local){ big = `${MARK[latest.turn]}${SIDE[latest.turn]}の番`; small = '練習盤（両方を指せます）'; }
  else if (inf.mySide === null){ big = `${MARK[latest.turn]}${SIDE[latest.turn]}の番`; small = '観戦中'; }
  else if (inf.mySide === latest.turn){ big = 'あなたの番です'; small = `あなたは${MARK[inf.mySide]}${SIDE[inf.mySide]}`; }
  else { big = '相手の考慮中…'; small = `あなたは${MARK[inf.mySide]}${SIDE[inf.mySide]}`; }
  if (item && !inf.result && latest.dual) small = `二刀流：${MARK[latest.turn]}あと${2 - latest.moved}手（持ち駒は打てません）`;
  if (S.pending) small = '送信中…';
  if (S.netDown) small = '通信が切れています。自動で再接続します…';
  if (S.viewPly !== null) small = `${ply}番目の局面を表示中 — 「最新」で戻ります`;
  if (rep.invalid) small = '棋譜に読めない手がありました。途中まで表示しています。';
  const chk = !inf.result && S.viewPly === null && inCheckAt(latest) ? '<span class="check">王手</span>' : '';

  const stamps = curStamps(), st = curStart();
  const rows = rep.entries.map((e, i) => {
    const dt = stamps[i] ? stamps[i] - (i ? stamps[i-1] : st) : null;
    const text = canSee(e.side) ? e.text : e.pub;
    return `<li data-ply="${i+1}" class="${ply === i+1 ? 'cur' : ''}${e.isMove ? '' : ' it'}"><span class="n">${e.isMove ? e.ply : ''}</span><span>${MARK[e.side]}${esc(text)}</span><span class="t">${dt !== null ? fmtTime(dt) : ''}</span></li>`;
  }).join('');
  const resRow = inf.result ? `<li class="res"><span class="n"></span><span>${inf.result.reason === 'resign' ? `${MARK[latest.turn]}投了` : REASON[inf.result.reason]}</span><span></span></li>` : '';

  let acts = '';
  if (S.local){
    acts = `<button class="btn" data-act="undo" ${rep.entries.length ? '' : 'disabled'}>待った</button><button class="btn" data-act="reset">はじめから</button>`;
  } else if (inf.mySide !== null && inf.status === 'playing'){
    acts = `<button class="btn danger" data-act="resign">投了する</button>`;
  } else if (inf.mySide !== null && inf.status === 'ended'){
    acts = g?.rematch ? `<button class="btn primary" data-act="open" data-id="${esc(g.rematch)}">次の対局へ</button>`
      : `<button class="btn primary" data-act="rematch" ${S.canWrite ? '' : 'disabled'}>先後を入れ替えてもう一局</button>`;
  }
  if (S.net === 'ntfy' && !S.local && g) acts += `<button class="btn" data-act="copy-link">招待リンクをコピー</button>`;
  acts += `<button class="btn" data-act="flip">盤を反転</button><button class="btn" data-act="copy" ${rep.entries.length ? '' : 'disabled'}>棋譜をコピー</button><button class="btn" data-act="sound">音 ${S.sound ? 'ON' : 'OFF'}</button>`;

  const panel = `<aside class="panel">
    <div class="status"><div class="big">${esc(big)}${chk}</div>${small ? `<div class="small">${esc(small)}</div>` : ''}</div>
    ${itemsPanel(latest, inf)}
    <div class="kifu"><div class="head"><span>棋譜</span><span>${modePill(curMode())} <span class="pill">${n}手</span></span></div>
      <ol id="kifuList"><li data-ply="0" class="${ply === 0 ? 'cur' : ''}"><span class="n">0</span><span>開始局面</span><span></span></li>${rows}${resRow}</ol>
      <div class="nav"><button class="btn" data-act="first" aria-label="最初へ">«</button><button class="btn" data-act="prev" aria-label="1つ戻る">‹</button><button class="btn" data-act="next" aria-label="1つ進む">›</button><button class="btn" data-act="last" aria-label="最新へ">最新</button></div>
    </div>
    <div class="actions-row">${acts}</div>
  </aside>`;

  const focusName = document.activeElement?.id === 'nameInput';
  $('#game').innerHTML = table + panel;
  S.flash = false;
  if (focusName) $('#nameInput')?.focus();
  const list = $('#kifuList');
  if (list){
    const cur = list.querySelector('li.cur');
    if (S.viewPly === null) list.scrollTop = list.scrollHeight;
    else if (cur) cur.scrollIntoView({block:'nearest'});
  }
}

function tick(){
  if (S.view !== 'game') return;
  if (!S.local && (!S.game || S.game.status === 'waiting')) return;
  const rep = getRep(), stamps = curStamps(), st = curStart(), n = rep.entries.length, inf = info();
  const tot = [0, 0];
  for (let i=0;i<n;i++) if (stamps[i]) tot[rep.entries[i].side] += stamps[i] - (i ? stamps[i-1] : st);
  let live = -1, think = 0;
  if (inf.status === 'playing'){ live = rep.pos.turn; think = Date.now() - (n ? stamps[n-1] || st : st); tot[live] += think; }
  for (const s of [0, 1]){
    const el = document.getElementById('clock-' + s);
    if (el) el.textContent = live === s ? `考慮 ${fmtTime(think)} / 計 ${fmtTime(tot[s])}` : `計 ${fmtTime(tot[s])}`;
  }
}
setInterval(tick, 1000);

/* ---------- effects ---------- */
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function cellCenter(sq){ const r = document.querySelector(`.cell[data-sq="${sq}"]`)?.getBoundingClientRect(); return r && {x: r.left + r.width/2, y: r.top + r.height/2, w: r.width, h: r.height}; }
function gridBox(){ return document.getElementById('grid')?.getBoundingClientRect(); }
function fx(cls, html, style, ms){
  const d = document.createElement('div'); d.className = 'fx ' + cls; d.innerHTML = html || '';
  Object.assign(d.style, style || {}); document.body.appendChild(d);
  setTimeout(() => d.remove(), ms); return d;
}
function banner(text, tone='', at){
  const g = gridBox(); if (!g) return;
  const p = at || {x: g.left + g.width/2, y: g.top + g.height * .42};
  fx('fx-banner ' + tone, esc(text), {left: p.x + 'px', top: p.y + 'px'}, 1600);
}
function ring(sq, color){ const c = cellCenter(sq); if (c) fx('fx-ring', '', {left: c.x + 'px', top: c.y + 'px', color}, 650); }
function fxVolt(sq){
  const c = cellCenter(sq), g = gridBox(); if (!c || !g) return;
  if (!reduced()) fx('fx-flash', '', {}, 520);
  const top = Math.max(0, g.top - 80), h = c.y - top, w = 140, pts = [[w/2, 0]];
  for (let i = 1; i < 8; i++) pts.push([w/2 + (Math.random()*2 - 1) * 46, h * i / 8]);
  pts.push([w/2, h]);
  const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
  fx('fx-bolt', `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" stroke="rgba(255,225,60,.55)" stroke-width="16"/><path d="${d}" stroke="#FFE84A" stroke-width="7"/><path d="${d}" stroke="#fff" stroke-width="2.5"/></svg>`,
    {left: (c.x - w/2) + 'px', top: top + 'px'}, 760);
  setTimeout(() => ring(sq, '#FFE14A'), 150);
  banner('10万ボルト！', 'blue', {x: c.x, y: Math.max(40, c.y - c.h * 1.2)});
}
function fxSwords(){
  const g = gridBox(); if (!g) return;
  fx('fx-swords', `<svg class="s1" viewBox="0 0 48 48">${SWORD(0)}</svg><svg class="s2" viewBox="0 0 48 48">${SWORD(0)}</svg>`,
    {left: (g.left + g.width/2) + 'px', top: (g.top + g.height/2) + 'px'}, 1400);
  banner('二刀流！', '', {x: g.left + g.width/2, y: g.top + g.height * .72});
}
function fxStar(sq){
  const c = cellCenter(sq); if (!c) return;
  for (let i = 0; i < 10; i++){
    const a = i / 10 * Math.PI * 2, r = 60 + Math.random() * 30;
    const el = fx('fx-spark', ICON.star, {left: c.x + 'px', top: c.y + 'px'}, 850);
    el.style.setProperty('--dx', Math.cos(a) * r + 'px'); el.style.setProperty('--dy', Math.sin(a) * r + 'px');
  }
  banner('スター！', 'gold', {x: c.x, y: Math.max(40, c.y - c.h * 1.1)});
}
function fxSlash(sqs){
  const cs = sqs.map(cellCenter).filter(Boolean); if (!cs.length) return;
  const x0 = Math.min(...cs.map(c => c.x)) - cs[0].w * .7, x1 = Math.max(...cs.map(c => c.x)) + cs[0].w * .7, y = cs[0].y;
  fx('fx-slash', '', {left: x0 + 'px', top: (y - 8) + 'px', width: (x1 - x0) + 'px', rotate: '-6deg'}, 650);
  banner('ギガスラッシュ！', 'blue', {x: (x0 + x1) / 2, y: Math.max(40, y - cs[0].h * 1.1)});
}
function fxGold(sq){
  const c = cellCenter(sq); if (!c) return;
  if (!reduced()) fx('fx-flash gold', '', {}, 520);
  fx('fx-rays', '', {left: c.x + 'px', top: c.y + 'px'}, 1350);
  banner('ゴールド・エクスペリエンス！', 'gold small', {x: c.x, y: Math.max(40, c.y - c.h * 1.2)});
}
function fxRoulette(item, hidden){
  const g = gridBox(); if (!g) return;
  const el = fx('fx-roulette', `<div class="slot"></div><div class="lbl"></div>`, {left: (g.left + g.width/2) + 'px', top: (g.top + g.height/2) + 'px'}, 1950);
  const slot = el.querySelector('.slot'), lbl = el.querySelector('.lbl');
  let k = 0;
  const spin = setInterval(() => { slot.innerHTML = ICON[I.ITEMS[k++ % I.ITEMS.length]]; }, 70);
  setTimeout(() => {
    clearInterval(spin);
    slot.innerHTML = hidden ? '<b>?</b>' : ICON[item];
    lbl.textContent = hidden ? '相手がアイテムを入手' : `${I.INFO[item].name} ゲット！`;
  }, 900);
}
function playEv(ev){
  switch (ev.type){
    case 'dual': fxSwords(); SFX.slash(); break;
    case 'star': fxStar(ev.sq); SFX.chime(); break;
    case 'giga': banner('ギガスラッシュ 構え', 'blue'); SFX.slash(); break;
    case 'mush': ring(ev.sq, '#E53935'); banner('パワーアップ！', '', cellCenter(ev.sq) && {x: cellCenter(ev.sq).x, y: Math.max(40, cellCenter(ev.sq).y - 50)}); SFX.boing(); break;
    case 'volt': fxVolt(ev.sq); SFX.zap(); break;
    case 'ge': if (canSee(ev.side)){ ring(ev.sq, '#F7C948'); banner('カードを仕込んだ', 'gold small'); } else banner('相手がカードを伏せた…', 'small'); SFX.chime(); break;
    case 'bounce': ring(ev.sq, '#E53935'); banner('ボヨン！', '', cellCenter(ev.sq) && {x: cellCenter(ev.sq).x, y: Math.max(40, cellCenter(ev.sq).y - 50)}); SFX.boing(); break;
    case 'geon': fxGold(ev.sq); SFX.gold(); break;
    case 'slash': fxSlash(ev.sqs); SFX.slash(); break;
    case 'box': fxRoulette(ev.item, !canSee(ev.side)); SFX.roulette(); break;
    case 'boxlost': ring(ev.sq, '#999'); banner('持ちきれない！', 'small'); break;
  }
}
function playNew(){
  const rep = getRep(), cnt = rep.entries.length;
  if (S.animSeen === null || cnt < S.animSeen || cnt - S.animSeen > 4){ S.animSeen = cnt; return; }
  let delay = 0;
  for (let i = S.animSeen; i < cnt; i++){
    const ent = rep.entries[i], evs = rep.events[i] || [], d0 = delay;
    if (ent.isMove) setTimeout(clack, d0);
    evs.forEach((ev, j) => setTimeout(() => playEv(ev), d0 + 120 + j * 450));
    delay += 250 + evs.length * 450;
  }
  S.animSeen = cnt;
}

/* ---------- input ---------- */
let drag = null;
function setPly(p){
  const n = getRep().states.length - 1;
  S.viewPly = p >= n ? null : Math.max(0, p);
  S.sel = null; S.promo = null; S.itemPick = null; render();
}
const flippedNow = () => (S.local ? false : info().mySide === 1) !== S.manualFlip;
document.addEventListener('pointerdown', e => {
  ensureAudio();
  if (e.button !== 0 || S.view !== 'game') return;
  if (S.promo){ if (!e.target.closest('.promo')){ S.promo = null; render(); } return; }
  const cell = e.target.closest('[data-sq]'), hp = e.target.closest('[data-drop]');
  if (S.itemPick){
    if (cell && I.itemTargets(getRep().pos, S.itemPick).includes(+cell.dataset.sq)){ e.preventDefault(); pickTarget(+cell.dataset.sq); return; }
    if (!e.target.closest('[data-item]')){ S.itemPick = null; render(); }
    return;
  }
  if (!cell && !hp) return;
  if (!canMove()) return;
  const pos = getRep().pos, legal = legalMoves(), st = isItem() ? pos : null;
  if (cell){
    const sq = +cell.dataset.sq;
    if (S.sel){
      const cands = legal.filter(m => matchesSel(m) && m.to === sq);
      if (cands.length){ e.preventDefault(); chooseMove(cands); return; }
    }
    const pc = pos.board[sq];
    if (pc && pc.s === pos.turn && legal.some(m => m.from === sq)){
      e.preventDefault();
      const wasSel = S.sel?.from === sq;
      S.sel = {from: sq};
      drag = {x0: e.clientX, y0: e.clientY, html: pieceHtml(pc, flippedNow() ? pc.s === 0 : pc.s === 1, st), wasSel, ghost: null};
      render(); return;
    }
    if (S.sel){ S.sel = null; render(); }
    return;
  }
  const k = hp.dataset.drop, side = +hp.dataset.side;
  if (side !== pos.turn || !legal.some(m => m.drop === k)) return;
  e.preventDefault();
  const wasSel = S.sel?.drop === k;
  S.sel = {drop: k};
  drag = {x0: e.clientX, y0: e.clientY, html: pieceHtml({t:k, s:side, p:false}, flippedNow() ? side === 0 : side === 1), wasSel, ghost: null};
  render();
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.ghost){
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost'; drag.ghost.innerHTML = drag.html;
    const cellEl = document.querySelector('.cell');
    if (cellEl) Object.assign(drag.ghost.style, {width: cellEl.offsetWidth + 'px', height: cellEl.offsetHeight + 'px', display: 'grid', placeItems: 'center'});
    document.body.appendChild(drag.ghost);
    S.dragging = true; render();
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
});
window.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost){
    d.ghost.remove(); S.dragging = false;
    const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-sq]');
    if (cell && S.sel){
      const sq = +cell.dataset.sq;
      const cands = legalMoves().filter(m => matchesSel(m) && m.to === sq);
      if (cands.length){ chooseMove(cands); return; }
      if (S.sel.from === sq){ render(); return; }
    }
    S.sel = null; render(); return;
  }
  if (d.wasSel){ S.sel = null; render(); }
});
window.addEventListener('pointercancel', () => { if (drag?.ghost) drag.ghost.remove(); drag = null; S.dragging = false; });

document.addEventListener('mouseover', e => {
  const c = e.target.closest('[data-item]'), box = $('#idesc');
  if (c && box && !S.itemPick) box.textContent = `${I.INFO[c.dataset.item].name}：${I.INFO[c.dataset.item].desc}`;
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameInput'){ S.myName = e.target.value.slice(0, 20); lsSet('name', S.myName); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input')){ if (e.key === 'Enter' && e.target.id === 'codeInput') $('[data-act="join-code"]')?.click(); return; }
  if (S.modal && e.key === 'Escape'){ S.modal = null; render(); return; }
  if (S.view !== 'game') return;
  const n = getRep().states.length - 1;
  if (e.key === 'Escape'){ S.sel = null; S.promo = null; S.confirm = null; S.itemPick = null; render(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); setPly((S.viewPly ?? n) - 1); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); setPly((S.viewPly ?? n) + 1); }
});
document.addEventListener('click', e => {
  const pb = e.target.closest('[data-promo]');
  if (pb && S.promo){ const want = pb.dataset.promo === '1'; const mv = S.promo.cands.find(m => m.promote === want); doAction(E.toUsi(mv)); return; }
  const ic = e.target.closest('[data-item]');
  if (ic && !ic.disabled){ useItem(ic.dataset.item); return; }
  const li = e.target.closest('#kifuList li[data-ply]');
  if (li){ setPly(+li.dataset.ply); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.dataset.act === 'close-modal' && b.classList.contains('modal') && e.target !== b) return;
  const a = b.dataset.act, n = getRep().states.length - 1;
  switch (a){
    case 'side': S.sidePref = b.dataset.v; render(); break;
    case 'rule': S.rulePref = b.dataset.v; render(); break;
    case 'create': createGame(S.sidePref); break;
    case 'join': joinGame(b.dataset.id); break;
    case 'join-code': {
      const m = ($('#codeInput')?.value || '').trim().match(/([a-z0-9]{12})\s*$/);
      if (!m){ toast('招待リンクかコードを貼り付けてください'); break; }
      openGame(m[1]); break;
    }
    case 'open': openGame(b.dataset.id); break;
    case 'practice': openLocal(); break;
    case 'lobby': backToLobby(); break;
    case 'rules': S.modal = 'rules'; render(); break;
    case 'close-modal': S.modal = null; render(); break;
    case 'flip': S.manualFlip = !S.manualFlip; render(); break;
    case 'first': setPly(0); break;
    case 'prev': setPly((S.viewPly ?? n) - 1); break;
    case 'next': setPly((S.viewPly ?? n) + 1); break;
    case 'last': setPly(n); break;
    case 'resign': S.confirm = 'resign'; render(); break;
    case 'resign-no': S.confirm = null; render(); break;
    case 'resign-yes': resign(); break;
    case 'cancel-game': cancelGame(); break;
    case 'rematch': rematch(); break;
    case 'copy': copyText(kifText(), '棋譜（KIF）をコピーしました'); break;
    case 'copy-link': copyText(inviteUrl(S.gameId), '招待リンクをコピーしました'); break;
    case 'sound': S.sound = !S.sound; lsSet('sound', S.sound); render(); break;
    case 'undo': S.localMoves = S.localMoves.slice(0, -1); S.localStamps = S.localStamps.slice(0, -1); S.viewPly = null; S.sel = null; S.itemPick = null; saveLocal(); render(); playNew(); break;
    case 'reset': S.localMoves = []; S.localStamps = []; S.localStart = Date.now(); S.localSeed = (Math.random() * 2**32) >>> 0; S.viewPly = null; S.sel = null; S.itemPick = null; S.animSeen = null; saveLocal(); render(); playNew(); break;
  }
});
window.addEventListener('hashchange', () => {
  if (ENV !== 'web') return;
  const id = location.hash.slice(1);
  if (/^[a-z0-9]{12}$/.test(id) && id !== S.gameId) openGame(id);
});

/* ---------- capabilities (artifact version) ---------- */
async function initCaps(resume){
  const [db, user, room] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('room')]);
  S.db = db; S.user = user; S.room = room;
  if (user){
    S.myId = await user.id();
    const c = await user.can('data.write');
    S.canWrite = c !== false;
  }
  S.capState = db ? 'ok' : 'none';
  if (db){
    S.net = 'db';
    db.collection('games').orderBy('updatedAt', 'desc').limit(60).onSnapshot(snap => {
      S.games = snap.docs.map(d => ({id: d.id, ...d.data()}));
      S.lobbyError = null;
      if (S.view === 'lobby') render();
    }, () => { S.lobbyError = '対局一覧の受信が止まりました。ページを開き直してください。'; render(); });
    if (resume?.gameId && !resume.local) openGame(resume.gameId);
  }
  if (room){
    room.onPeers(ch => {
      S.peers = ch.peers.filter(p => p.kind === 'viewer');
      S.online = new Set(S.peers.map(p => p.by || p.presence?.uid).filter(Boolean));
      render();
    }, () => {});
    room.on('moved', msg => {
      if (msg.sameTab || msg.data?.game !== S.gameId || !S.gameRef) return;
      S.gameRef.get().then(applyGameSnap).catch(() => {});
    }, () => {});
    setPresence();
  }
  render();
}
// opponent's move safety net for the artifact store, in case its live stream lags
setInterval(() => {
  if (S.net === 'db' && S.view === 'game' && !S.local && S.gameRef && info().status === 'playing' && !canAct() && !S.pending && !document.hidden)
    S.gameRef.get().then(applyGameSnap).catch(() => {});
}, 12000);

function start(data){
  data = data || {};
  if (data.local) openLocal(); else render();
  window.claude?.hot?.snapshot?.(() => ({gameId: S.gameId, local: S.local}));
  if (ENV === 'artifact') initCaps(data);
  else {
    const id = location.hash.slice(1);
    if (/^[a-z0-9]{12}$/.test(id)) openGame(id);
    else if (data.gameId && !data.local) openGame(data.gameId);
  }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
